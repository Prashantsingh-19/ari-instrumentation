name = "ari-instrumentation"
main = "src/worker.js"
compatibility_date = "2025-04-01"

# Must point to the same KV namespace as the portfolio's SESSIONS binding.
# The portfolio ari-worker writes analytics logs to env.SESSIONS with a "log:" prefix.
[[kv_namespaces]]
binding = "ANALYTICS"
id = ""  # ← same namespace ID as the portfolio's SESSIONS binding
